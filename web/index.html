<!doctype html>
<html lang="cs">
  <head>
    <!--
      THESIS: A calm developer workspace that gets teams from sign-in to usable credentials in seconds.
      OWN-WORLD: Deep blue structure, focused red signals, airy light surfaces, precise rounded controls, restrained depth.
      STORY: Confirm access, choose a deployment, copy the exact values, then find the VZP challenge data.
      FIRST VIEWPORT: Compact workspace navigation above a decisive blue field and a visible model inventory.
      FORM: Operate mode; modern product workspace with task-first density and responsive utility panels.

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Modely, endpointy a datové podklady pro účastníky Rakathonu." />

    <script src="/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
